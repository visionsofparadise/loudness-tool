name: Release

on: workflow_dispatch

permissions:
   contents: read

concurrency:
   group: release
   cancel-in-progress: false

jobs:
   gate:
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-24.04
      timeout-minutes: 60
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              fetch-depth: 0
              persist-credentials: false
         - name: Refuse a released version
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              tag="v$(node -p "require('./package.json').version")"
              if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = false ]; then
                 echo "::error::$tag is already released; bump the version in package.json"
                 exit 1
              fi
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
              cache: npm
         - name: Pin npm 12
           run: npm install -g npm@12
         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project
         - run: npm ci
         - run: npm run check
         - run: npm run unit
         - run: npm run integration

   build:
      needs: gate
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: windows-2025
                 platform: windows-x64
               - os: windows-11-arm
                 platform: windows-arm64
               - os: ubuntu-24.04
                 platform: linux-x64
               - os: ubuntu-24.04-arm
                 platform: linux-arm64
               - os: macos-15
                 platform: mac-arm64
               - os: macos-15-intel
                 platform: mac-x64
      runs-on: ${{ matrix.os }}
      timeout-minutes: 60
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
              cache: npm
         - name: Pin npm 12
           run: npm install -g npm@12
         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project
         # prepare's tool installer has no Windows arm64, Linux arm64 or macOS x64 binaries, so the build installs
         # packages without lifecycle scripts and then runs the install scripts of the two compilers it uses.
         - run: npm ci --ignore-scripts
         - run: npm rebuild bun esbuild
         - run: npm run build
         - name: Read the package version
           shell: bash
           run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
         - name: Install NSIS 3.13
           if: runner.os == 'Windows'
           shell: pwsh
           run: |
              $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
              curl.exe -fsSL --retry 3 -o $zip 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip'
              if ($LASTEXITCODE -ne 0) { Write-Output "::error::downloading NSIS failed"; exit 1 }
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
              if ($hash -ne 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8') { Write-Output "::error::nsis-3.13.zip has sha256 $hash"; exit 1 }
              Expand-Archive -LiteralPath $zip -DestinationPath .tools/nsis
         - run: node scripts/package.mjs
         - name: Compare the executable with the Node build
           run: node scripts/smoke.mjs out/make/loudness-tool-${{ env.VERSION }}-${{ matrix.platform }}${{ runner.os == 'Windows' && '.exe' || '' }}
         - name: Install, reinstall, run, and uninstall the Windows installer
           if: runner.os == 'Windows'
           shell: pwsh
           run: >-
              ./scripts/testWindowsInstaller.ps1 -InstallerPath out/make/loudness-tool-${{ env.VERSION }}-${{ matrix.platform }}-setup.exe
              -ExpectedExecutablePath out/make/loudness-tool-${{ env.VERSION }}-${{ matrix.platform }}.exe -ExpectedVersion ${{ env.VERSION }}
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           if: always() && runner.os == 'Windows'
           with:
              name: installer-report-${{ matrix.platform }}
              retention-days: 1
              path: .scratch/installer/report.json
              include-hidden-files: true
              if-no-files-found: warn
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           with:
              name: release-${{ matrix.platform }}
              retention-days: 7
              path: out/make/*
              if-no-files-found: error

   publish:
      needs: build
      runs-on: ubuntu-24.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
           with:
              pattern: release-*
              merge-multiple: true
              path: artifacts
         - run: node scripts/release.mjs checksums artifacts
         - name: Publish an unreleased version
           env:
              GH_TOKEN: ${{ github.token }}
           run: node scripts/release.mjs publish artifacts
         - name: Delete older stable releases
           env:
              GH_TOKEN: ${{ github.token }}
           run: node scripts/releaseRetention.mjs releases "v$(node -p "require('./package.json').version")"

   cleanup-artifacts:
      needs: [gate, build, publish]
      if: ${{ always() && needs.gate.result == 'success' && needs.build.result == 'success' && needs.publish.result == 'success' }}
      runs-on: ubuntu-24.04
      permissions:
         actions: write
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
         - name: Delete temporary workflow artifacts
           env:
              GH_TOKEN: ${{ github.token }}
           run: node scripts/releaseRetention.mjs artifacts
